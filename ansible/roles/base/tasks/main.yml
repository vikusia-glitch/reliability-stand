---
- name: Установить базовые пакеты (Debian и Ubuntu)
  when: ansible_os_family == "Debian"
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3-pip]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Установить базовые пакеты (RHEL и производные)
  when: ansible_os_family == "RedHat"
  ansible.builtin.dnf:
    name: [ca-certificates, curl, gnupg2, python3-pip]
    state: present

- name: Создать каталоги под конфигурацию
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/apt/keyrings
    - /etc/docker
    - /etc/systemd/journald.conf.d

- name: Ограничить рост системного журнала
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse=500M
    owner: root
    group: root
    mode: "0644"
  notify: restart journald
