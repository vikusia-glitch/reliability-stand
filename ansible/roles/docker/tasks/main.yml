---
- name: Проверить, что дистрибутив поддерживается ролью
  ansible.builtin.assert:
    that: ansible_os_family in ["Debian", "RedHat"]
    fail_msg: >-
      Роль умеет ставить Docker на Debian/Ubuntu и RHEL/Rocky/Alma.
      Обнаружено: {{ ansible_distribution }} ({{ ansible_os_family }}).
      Поставьте Docker вручную и запустите плейбук с --skip-tags docker.

- name: Установить Docker (Debian и Ubuntu)
  when: ansible_os_family == "Debian"
  block:
    - name: Добавить ключ репозитория Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        owner: root
        group: root
        mode: "0644"

    - name: Подключить репозиторий Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_apt_arch }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }}
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Установить пакеты Docker
      ansible.builtin.apt:
        name: "{{ docker_packages }}"
        state: present
        update_cache: true

- name: Установить Docker (RHEL и производные)
  when: ansible_os_family == "RedHat"
  block:
    - name: Подключить репозиторий Docker
      ansible.builtin.yum_repository:
        name: docker-ce
        description: Docker CE
        baseurl: "https://download.docker.com/linux/centos/$releasever/$basearch/stable"
        gpgcheck: true
        gpgkey: https://download.docker.com/linux/centos/gpg

    - name: Установить пакеты Docker
      ansible.builtin.dnf:
        name: "{{ docker_packages }}"
        state: present

- name: Ограничить размер логов контейнеров
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart docker

- name: Включить и запустить демон Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
