# Инвентарь стенда. Для локальной проверки достаточно localhost.
#
# Идемпотентность проверяется так:
#   ansible-playbook site.yml          # первый прогон — changed
#   ansible-playbook site.yml          # второй прогон — changed=0

[stand]
localhost ansible_connection=local

# Пример боевой машины:
# stand-01 ansible_host=10.1.0.42 ansible_user=admin

[stand:vars]
stand_dir=/opt/reliability-stand
grafana_password=admin
